# Radar de leads gratis: cada 30 minutos busca en Reddit y Hacker News y
# manda los leads por Telegram. Solo se ejecuta si la variable del repositorio
# LEAD_RADAR_ENABLED vale "true" (Settings → Secrets and variables → Actions).
#
# El programador de GitHub se salta la mayoría de ejecuciones (2 en 18 horas),
# así que cada ejecución lanza la siguiente al terminar, 30 minutos después
# de haber empezado. El cron solo sirve para reanudar la cadena si se corta.
# Para pararlo todo: LEAD_RADAR_ENABLED = false.
name: Lead radar

on:
  schedule:
    # Minutos 7 y 37: GitHub retrasa o descarta más las tareas en punto y a y media.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Solo enviar un mensaje de prueba a Telegram"
        type: boolean
        default: false

# Una sola ejecución a la vez y como mucho una en espera: si llega otra, GitHub
# cancela la que esperaba, así que nunca hay dos cadenas en paralelo.
concurrency:
  group: lead-radar
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # para lanzar la siguiente ejecución

jobs:
  scan:
    if: vars.LEAD_RADAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: lead-radar
    steps:
      - name: Anotar la hora de inicio
        run: echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"
        working-directory: .

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: lead-radar/requirements.txt

      - run: pip install -r requirements.txt

      # Recuerda qué posts ya se analizaron para no avisar dos veces.
      - name: Restaurar posts vistos
        uses: actions/cache/restore@v4
        with:
          path: lead-radar/state
          key: lead-radar-state-v2-${{ github.run_id }}
          restore-keys: lead-radar-state-v2-

      - name: Buscar leads
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT || 'python:lead-radar:v1 (personal use)' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.test_telegram }}" = "true" ]; then
            python radar.py --config proyectos.json --test-telegram
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            python radar.py --config proyectos.json
          else
            echo "Sin ANTHROPIC_API_KEY: modo palabras clave"
            python radar.py --config proyectos.json --no-llm
          fi

      - name: Guardar posts vistos
        if: always()
        uses: actions/cache/save@v4
        with:
          path: lead-radar/state
          key: lead-radar-state-v2-${{ github.run_id }}

      # Lanza la siguiente ejecución. Los eventos workflow_dispatch creados con
      # GITHUB_TOKEN sí arrancan flujos (es una de las dos excepciones).
      - name: Programar la siguiente búsqueda
        if: ${{ !cancelled() && inputs.test_telegram != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sin hora de inicio se espera la media hora entera, nunca menos.
          start=${RUN_START:-$(date +%s)}
          wait=$(( start + 30*60 - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then
            echo "Siguiente búsqueda en $((wait / 60)) min"
            sleep "$wait"
          fi
          gh workflow run lead-radar.yml --repo "$GITHUB_REPOSITORY" --ref main
